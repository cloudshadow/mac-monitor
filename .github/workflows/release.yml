name: Build release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: 'Semver (for example 0.1.0); release gates are reviewed separately'
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix web ci
      - run: node --test scripts/i18n/validate.test.mjs
      - run: bash scripts/swift.sh test -j 4
      - run: bash scripts/package-app.sh "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.sha256
  publish:
    needs: package
    if: vars.RELEASE_ENABLED == 'true' && github.repository == vars.RELEASE_REPOSITORY
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: test -s LICENSE
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          printf 'Cloud Mac Monitor %s\n\nThis is a release candidate. Review docs/release-checklist.md before publication; target-hardware acceptance remains required. The app uses ad-hoc signing and may require macOS first-launch approval. Installation requests local administrator authorization.\n' "$RELEASE_VERSION" > release-notes.md
          gh release create "v$RELEASE_VERSION" release-assets/* --draft --title "Cloud Mac Monitor $RELEASE_VERSION" --notes-file release-notes.md
