name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run i18n:check
      - run: node --test scripts/i18n/validate.test.mjs
      - run: bash scripts/swift.sh test -j 4
      - run: npm --prefix web run build
      - run: npm --prefix web test
      - run: python3 scripts/installer-reinstall-test.py
      - run: python3 scripts/smoke.py
      - run: python3 scripts/port-smoke.py
      - run: python3 scripts/lan-smoke.py
      - run: bash scripts/package-app.sh 0.1.10
      - uses: actions/upload-artifact@v4
        with:
          name: development-app
          path: |
            artifacts/*.tar.gz
            artifacts/*.sha256
